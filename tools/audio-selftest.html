<!doctype html>
<meta charset="utf-8">
<title>Audio features self-test</title>
<style>body{font-family:system-ui;max-width:640px;margin:40px auto} .ok{color:#1b7f3b} .bad{color:#b00020} pre{background:#f4f4f4;padding:8px}</style>
<h2>Audio features self-test</h2>
<p>Serve from the repo root: <code>python3 -m http.server 8765</code>, then open <code>http://localhost:8765/tools/audio-selftest.html</code>.</p>
<pre id="out">loading model…</pre>
<script type="module">
import { createAudioFeatures } from '../ext/lib/audio-features.js';
const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; };
const results = [];
function check(name, ok) { results.push(ok); log(`${ok ? 'PASS' : 'FAIL'} ${name}`); }
try {
  const base = new URL('../ext', location.href).href;
  const t0 = performance.now();
  const af = await createAudioFeatures(base);
  log(`model loaded in ${(performance.now() - t0).toFixed(0)} ms`);
  const sine = new Float32Array(16000);
  for (let i = 0; i < sine.length; i++) sine[i] = 0.5 * Math.sin(2 * Math.PI * 440 * i / 16000);
  const t1 = performance.now();
  const r = af.classify(sine);
  const ms = performance.now() - t1;
  const top = af.top(r.scores, 3);
  log(`sine top-3: ${top.map(([n, s]) => `${n}=${s.toFixed(2)}`).join(', ')}  (${ms.toFixed(0)} ms)`);
  check('sine wave recognized in top-3', top.some(([n]) => n === 'Sine wave'));
  check('classify under 100 ms', ms < 100);
  const silence = af.classify(new Float32Array(16000));
  log(`silence score: ${silence.silence.toFixed(2)}`);
  check('silence > 0.5', silence.silence > 0.5);
  check('521 scores', r.scores.length === 521);
  out.className = results.every(Boolean) ? 'ok' : 'bad';
  document.title = results.every(Boolean) ? 'SELFTEST PASS' : 'SELFTEST FAIL';
} catch (e) {
  log('ERROR ' + e.message); out.className = 'bad'; document.title = 'SELFTEST ERROR';
}
</script>
