<!doctype html>
<meta charset="utf-8">
<title>Commercial Switcher — debug</title>
<style>
  body { font: 13px/1.4 -apple-system, system-ui, sans-serif; background: #1b1b1b; color: #eee; margin: 0; padding: 16px; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  canvas#chart { width: 100%; max-width: 1200px; height: 260px; background: #111; border-radius: 6px; display: block; }
  .thumb { position: relative; width: 320px; height: 180px; background: #000; border-radius: 6px; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: fill; }
  .thumb .c { position: absolute; border: 2px solid #fdd835; box-sizing: border-box; }
  .thumb .c.scoreboard { border-color: #43a047; }
  .legend span { display: inline-block; margin-right: 12px; } .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 4px; border-radius: 2px; }
  table { border-collapse: collapse; } td { padding: 2px 10px 2px 0; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 6px 12px; margin: 4px 6px 4px 0; border-radius: 6px; border: 0; background: #333; color: #eee; cursor: pointer; }
  button:hover { background: #444; } label { margin-right: 12px; }
  #state { font-weight: 600; } .muted { color: #fdd835; } .shadow { color: #64b5f6; }
</style>
<h1>Commercial Switcher — live debug</h1>
<div class="row">
  <div>
    <canvas id="chart" width="1200" height="260"></canvas>
    <div class="legend" id="legend"></div>
  </div>
</div>
<div class="row" style="margin-top:12px">
  <div class="thumb" id="thumb"><img id="img" alt=""></div>
  <table id="vals"></table>
  <div>
    <div id="state">waiting for samples…</div>
    <div style="margin-top:8px">
      <button id="mute">Mute / Unmute (Alt+Shift+M)</button>
      <button id="pause">Pause / Resume (Alt+Shift+P)</button>
    </div>
    <div>
      <button id="labelAd">Mark AD (A)</button>
      <button id="labelGame">Mark GAME (G)</button>
      <button id="export">Export log</button>
    </div>
    <div style="margin-top:8px">
      <label><input type="checkbox" id="shadow"> Shadow mode (detect only, never switch)</label>
    </div>
    <div style="margin-top:8px;opacity:.7">White ticks = black cuts. Bands: state (green game / red commercial), mute (yellow real / blue shadow).</div>
  </div>
</div>
<script type="module" src="debug.js"></script>
